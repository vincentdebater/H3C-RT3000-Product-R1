name: Build H3C Magic OpenWrt (HW-A) iptables ver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查代码仓库 (Checkout)
      uses: actions/checkout@v4

    - name: 初始化编译环境 (Setup Build Environment)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget coccinelle ocaml
        sudo apt-get clean

    - name: 更新与安装软件源 (Update & Install Feeds)
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 修正 OpenWrt 配置并强制关闭冲突项
      run: |
        set -eux

        # 1) 复制自定义配置
        cp configs/iptablesver-h3c-magic.config .config

        # 2) 删除根目录 .config 中的坏配置项
        grep -vE '^(CONFIG_ARCH_MULTI_V4|# CONFIG_ARCH_MULTI_V4|CONFIG_PACKAGE_keepalived|CONFIG_KEEPALIVED_IPTABLES|CONFIG_PACKAGE_kmod-wireguard|CONFIG_PACKAGE_wireguard|CONFIG_PACKAGE_kmod-wireguard)' .config > .config.tmp || true

        # 3) 强制写入必须关闭的 Kconfig 选项
        {
          echo '# CONFIG_ARCH_MULTI_V4 is not set'
          echo '# CONFIG_PACKAGE_keepalived is not set'
          echo '# CONFIG_KEEPALIVED_IPTABLES is not set'
          echo '# CONFIG_PACKAGE_kmod-wireguard is not set'
          echo '# CONFIG_PACKAGE_wireguard is not set'
        } >> .config.tmp

        mv .config.tmp .config

        # 4) 关键步骤：修正编译目录中生成出来的 linux .config
        for f in $(find build_dir -path '*/linux-*/.config' -type f 2>/dev/null); do
          sed -i '/^CONFIG_ARCH_MULTI_V4\|^# CONFIG_ARCH_MULTI_V4\|^CONFIG_PACKAGE_keepalived\|^CONFIG_KEEPALIVED_IPTABLES\|^CONFIG_PACKAGE_kmod-wireguard\|^CONFIG_PACKAGE_wireguard\|^# CONFIG_PACKAGE_kmod-wireguard/d' "$f" || true
          {
            echo '# CONFIG_ARCH_MULTI_V4 is not set'
            echo '# CONFIG_PACKAGE_keepalived is not set'
            echo '# CONFIG_KEEPALIVED_IPTABLES is not set'
            echo '# CONFIG_PACKAGE_kmod-wireguard is not set'
            echo '# CONFIG_PACKAGE_wireguard is not set'
          } >> "$f"
        done

        # 5) 生成最终配置，避免交互式 Kconfig
        make defconfig || make oldconfig || true

    - name: 下载源码依赖包 (Download Packages)
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -vf {} \;

    - name: 开始固件编译 (Compile Firmware)
      run: |
        echo "开始编译..."
        make -j$(nproc) || make -j1 V=s

    - name: 上传编译出的固件 (Upload Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: H3C-RW3000-HW-A-Firmware
        path: |
          bin/targets/ipq50xx/arm/*.bin
          bin/targets/ipq50xx/arm/*.img
          bin/targets/ipq50xx/arm/config.buildinfo