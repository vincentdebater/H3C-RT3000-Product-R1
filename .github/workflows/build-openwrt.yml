name: Build H3C Magic OpenWrt (HW-A)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检查代码仓库 (Checkout)
      uses: actions/checkout@v4

    - name: 初始化编译环境 (Setup Build Environment)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget coccinelle ocaml
        sudo apt-get clean

    - name: 添加 Passwall 官方 Feeds 源码
      run: |
        echo 'src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git main' >> feeds.conf.default
        echo 'src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git main' >> feeds.conf.default

    - name: 更新与安装软件源 (Update & Install Feeds)
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 应用自定义配置文件 (Apply Custom Config)
      run: |
        cp configs/h3c-magic.config .config
        make defconfig

    - name: 启动后台实时 Go 版本修正守护进程 (Background Go Mod Patcher)
      run: |
        # 启动一个后台循环，每隔 0.5 秒自动扫描并降级所有解压出来的 go.mod
        nohup bash -c '
        while true; do
          find build_dir/ feeds/ -name "go.mod" -type f 2>/dev/null | while read file; do
            if grep -q "go 1\." "$file"; then
              sed -i "s/^go [0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?/go 1.23/g" "$file"
            fi
          done
          sleep 0.5
        done
        ' > /dev/null 2>&1 &
        echo "Background go.mod patcher started successfully."

    - name: 下载源码依赖包 (Download Packages)
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -vf {} \;

    - name: 开始固件编译 (Compile Firmware)
      run: |
        echo "开始编译..."
        make -j$(nproc) || make -j1 V=s

    - name: 上传编译出的固件 (Upload Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: H3C-RW3000-HW-A-Firmware
        path: |
          bin/targets/ipq50xx/arm/*.bin
          bin/targets/ipq50xx/arm/*.img
          bin/targets/ipq50xx/arm/config.buildinfo